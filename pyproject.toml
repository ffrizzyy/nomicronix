[project]
name = "nomicronix"
version = "0.1.0"
description = "Nomicronix: personal AI crypto trading agent"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nomicronix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: hits the real exchange; never run by default (use -m network)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
mypy_path = "src"
